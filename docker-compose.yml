# iGotify Notification Assistant for notify.gatewayy.net
# Deployed by xCloud at igotify.gatewayy.net (xCloud nginx terminates TLS and proxies to 127.0.0.1:8681).
# External-instance mode: the iOS app registers itself, so no GOTIFY_* / SECNTFY_* env vars are needed.
services:
  igotify:
    image: ghcr.io/androidseb25/igotify-notification-assist:v1.6.0.1
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8681:8080"
    volumes:
      - api-data:/app/data
    environment:
      ENABLE_CONSOLE_LOG: "true"
      ENABLE_SCALAR_UI: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/Version"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  api-data:
